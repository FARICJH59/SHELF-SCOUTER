name: HOARE Remediation Boundary

on:
  push:
    branches:
      - hoare-debugging-agent
  pull_request:
    branches:
      - integration-now
      - hoare-debugging-agent

permissions:
  contents: read

jobs:
  remediation-boundary:
    name: HOARE governance boundary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test runner
        run: python -m pip install --upgrade pip pytest

      - name: Compile HOARE remediation modules
        run: |
          python -m py_compile \
            hoare_debugging_agent.py \
            hoare_debugging_runtime.py \
            hoare_remediation_proposal.py \
            hoare_remediation_admission.py \
            hoare_remediation_execution.py \
            hoare_remediation_coordinator.py \
            hoare_execution_plan.py \
            hoare_execution_request.py

      - name: Run governed remediation tests
        env:
          HOARE_EXECUTION_SIGNING_KEY: shelf-scouter-ci-remediation-key
        run: |
          python -m pytest -q \
            test_hoare_debugging_agent.py \
            test_hoare_debugging_runtime.py \
            test_hoare_remediation_proposal.py \
            test_hoare_remediation_admission.py \
            test_hoare_remediation_execution.py \
            test_hoare_remediation_receipt.py \
            test_hoare_remediation_coordinator.py

  regression:
    name: SHELF-SCOUTER regression suite
    runs-on: ubuntu-latest
    needs: remediation-boundary
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install application dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pytest

      - name: Compile application Python
        run: python -m compileall -q .

      - name: Run full regression suite
        env:
          HOARE_EXECUTION_SIGNING_KEY: shelf-scouter-ci-remediation-key
        run: python -m pytest -q
